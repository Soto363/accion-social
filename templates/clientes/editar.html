{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>{{ 'Editar' if cliente else 'Crear' }} Cliente</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('crear_cliente') if not cliente else url_for('editar_cliente', id=cliente.id_cliente) }}">
                        <div class="mb-3">
                            <label for="cedula" class="form-label">Cédula</label>
                            <input type="text" class="form-control" id="cedula" name="cedula" 
                                   value="{{ cliente.cedula if cliente }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" 
                                   value="{{ cliente.nombre if cliente }}" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" 
                                       value="{{ cliente.telefono if cliente }}">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       value="{{ cliente.email if cliente }}">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="id_ciudad">Ciudad</label>
                            <select name="id_ciudad" class="form-control" required>
                                {% for ciudad in ciudades %}
                            <option value="{{ ciudad.id_ciudad }}" {% if ciudad.id_ciudad == cliente.id_ciudad %}selected{% endif %}>
                                {{ ciudad.nombre }}
                            </option>
                                {% endfor %}
                            </select>
                        </div>


                        <div class="mb-3">
                            <label for="direccion" class="form-label">Dirección</label>
                            <textarea class="form-control" id="direccion" name="direccion" 
                                      rows="2">{{ cliente.direccion if cliente }}</textarea>
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('clientes') }}" class="btn btn-secondary me-md-2">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                {{ 'Actualizar' if cliente else 'Guardar' }}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
