{% extends "base.html" %}

{% block title %}Editar Adulto Mayor | Sistema de Inclusión{% endblock %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col-md-6">
            <h2>Editar Adulto Mayor</h2>
        </div>
        <div class="col-md-6 text-end">
            <a href="{{ url_for('ver_adulto_mayor', id=inclusion.id) }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-1"></i> Cancelar
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">{{ inclusion.nombre }}</h4>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('editar_adulto_mayor', id=inclusion.id) }}">
                <!-- Sección I: Información General -->
                <div class="mb-4">
                    <h5 class="border-bottom pb-2">I. INFORMACIÓN GENERAL</h5>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombres y apellidos</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" 
                                       value="{{ inclusion.nombre }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="cedula" class="form-label">Número de identificación</label>
                                <input type="text" class="form-control" id="cedula" name="cedula" 
                                       value="{{ inclusion.cedula }}" required readonly>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Más campos editables... -->
                    
                </div>
                
                <!-- Secciones restantes del formulario -->
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Scripts para manejar la edición (similar al de nuevo.html)
</script>
{% endblock %}
